name: "Mtb-Agentic-Scientific-Discovery-Orchestrator"
description: "Master Omnigent workflow connecting 6 specialist agents for Mycobacterium tuberculosis drug discovery and BSL-3 assay validation."
version: "2.0.0"

orchestration:
  mode: sequential_with_feedback
  log_level: INFO
  track_state: true
  save_intermediate_results: true
  result_directory: ./results/

default_executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.3
  max_tokens: 4096

phases:
  phase_1_literature:
    name: "Literature Discovery (Literature Agent)"
    agent: "LiteratureAgent"
    description: "Search Europe PMC and PubChem for Mtb drug resistance mechanisms and cell wall targets (DprE1, InhA)."
    enabled: true
    timeout_seconds: 300

  phase_2_hypothesis:
    name: "Hypothesis Generation (Insight Agent)"
    agent: "HypothesisAgent"
    description: "Propose testable anti-tubercular hypotheses addressing drug resistance gaps."
    enabled: true
    timeout_seconds: 300

  phase_3_experiment:
    name: "Experiment Design (Experiment Planner)"
    agent: "ExperimentAgent"
    description: "Design BSL-3 microplate Alamar Blue assays, sample sizes, and budget constraints."
    enabled: true
    timeout_seconds: 300
    human_approval_required: true

  phase_4_analysis:
    name: "Result Analysis (Analysis Agent)"
    agent: "AnalysisAgent"
    description: "Statistically evaluate MIC reductions and intracellular macrophage survival rates."
    enabled: true
    timeout_seconds: 300

  phase_5_report:
    name: "Research Report Generation (Report Agent)"
    agent: "ReportAgent"
    description: "Generate publication-ready research paper with APA citations and BSL-3 protocols."
    enabled: true
    timeout_seconds: 300

  phase_6_knowledge_graph:
    name: "Knowledge Graph Update (Knowledge Graph Agent)"
    agent: "KnowledgeGraphAgent"
    description: "Update evidence, Mtb targets, compounds, and directional relationship links in JSON-LD."
    enabled: true
    timeout_seconds: 300

feedback_loop:
  enabled: true
  max_iterations: 2
  trigger_conditions:
    - hypothesis_not_confirmed
    - low_confidence_findings

state_management:
  persistence: true
  storage_format: json
  state_directory: ./state/