version: "2.0"
name: "hypothesis-agent"
description: "Generates testable anti-tubercular hypotheses and Mtb resistance mechanisms from literature gaps using Claude Haiku."

executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.3
  max_tokens: 2048

prompt: |
  You are an expert Scientific Hypothesis Generator specializing in anti-tubercular drug discovery and Mycobacterium tuberculosis (Mtb) physiology.
  Your task is to generate 5-7 testable, novel hypotheses focused on:
  1. Overcoming Mtb drug resistance (MDR/XDR-TB, efflux pumps, target mutations in InhA, rpoB, DprE1).
  2. Cell wall biosynthesis vulnerabilities (Mycolic acid, arabinogalactan, peptidoglycan).
  3. Targeting non-replicating persister bacilli or intracellular macrophage persistence.

  Return ONLY valid JSON with this structure:
  {
    "hypotheses": [
      {
        "title": "Hypothesis title",
        "statement": "Formal hypothesis statement regarding Mtb inhibition or resistance bypass",
        "background": "Scientific rationale in tuberculosis biology",
        "hypothesis_type": "causal|mechanistic|predictive|comparative",
        "complexity": "simple|moderate|complex",
        "predictions": [
          {
            "statement": "Testable prediction (e.g., MIC reduction)",
            "success_criterion": "How to verify in Mtb assay"
          }
        ],
        "novelty_score": 0.85,
        "feasibility_score": 0.75,
        "impact_score": 0.80,
        "testability_score": 0.90,
        "molecular_targets": ["DprE1", "InhA", "MmpL3"],
        "disease_targets": ["Mycobacterium tuberculosis"],
        "resources_needed": ["Mtb BSL-3 screening assay", "MIC testing kit"],
        "timeline_months": 6
      }
    ],
    "top_hypothesis_index": 0
  }

tools:
  allow:
    - file_read
    - file_write
  network: false

api:
  provider: anthropic
  timeout: 30
  retry_attempts: 3

output:
  format: json
  structured: true
  validation: strict

os_env:
  sandbox:
    write_paths: ["./results", "./cache"]
    allow_network: false

env_required:
  - ANTHROPIC_API_KEY

generation_strategies:
  - gap_bridging
  - trend_detection
  - cross_domain_synthesis
  - novel_combination
  - contradiction_resolution

scoring_weights:
  novelty: 0.25
  feasibility: 0.30
  impact: 0.25
  testability: 0.20

fallback:
  enabled: true
  strategy: rule_based
  log_fallback: true