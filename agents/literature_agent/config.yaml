name: Literature Agent (Drug Discovery & Biology)
description: Search and analyze biomedical literature for drug discovery, molecular targets, and evidence gaps
version: "2.0.0"
domain: Drug Discovery and Biology

# Core agent configuration
agent:
  type: specialist
  role: biomedical_researcher
  domain: drug_discovery
  capabilities:
    - search_biomedical_databases
    - search_chemical_compounds
    - extract_molecular_evidence
    - extract_assay_data
    - identify_drug_targets
    - identify_gaps
    - synthesize_findings

# Database connectors - Biomedical Focus
databases:
  europe_pmc:
    name: Europe PMC
    description: Comprehensive biomedical and life sciences literature repository
    api_url: https://www.ebi.ac.uk/europepmc/webservices/rest
    endpoints:
      search: /search
      articles: /articles
      citations: /citations
    rate_limit: 10  # requests per second
    capabilities:
      - full_text_search
      - biomedical_filtering
      - pmcid_extraction
      - mesh_term_filtering
      - citation_network
      - full_text_retrieval
    biomedical_fields:
      - disease_name
      - drug_name
      - protein_target
      - pathway
      - organism
    output_fields:
      - PMCID
      - PMID
      - DOI
      - title
      - abstract
      - keywords
      - mesh_terms

  pubchem:
    name: PubChem
    description: Public repository of chemical compound information
    api_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    endpoints:
      compound: /compound
      assay: /assay
      substance: /substance
    rate_limit: 5  # requests per second
    capabilities:
      - compound_search
      - molecular_properties
      - assay_data_retrieval
      - bioactivity_search
      - structure_search
      - target_search
    chemical_fields:
      - compound_name
      - molecular_weight
      - molecular_formula
      - iupac_name
      - inchi
      - smiles
      - canonical_smiles
    bioactivity_fields:
      - target_name
      - bioactivity_type
      - activity_value
      - assay_description
      - organism
      - cell_line

  openalex:
    name: OpenAlex
    description: Comprehensive academic library (fallback)
    api_url: https://api.openalex.org
    endpoints:
      works: /works
    rate_limit: 10
    capabilities:
      - full_text_search
      - filtering_by_year

# Drug discovery specific search configuration
search:
  default_limit: 50
  max_limit: 500
  default_year_range: [2015, 2026]

  drug_discovery_keywords:
    - drug target identification
    - compound screening
    - bioactivity assay
    - drug candidate
    - lead optimization
    - ADME properties
    - molecular docking
    - structure-activity relationship
    - hit-to-lead
    - preclinical development

  mesh_terms:
    - Drug Discovery
    - Molecular Docking Simulation
    - Structure-Activity Relationship
    - High-Throughput Screening Assays
    - Drug Screening
    - Pharmaceutical Chemistry
    - Protein Binding
    - Enzyme Inhibition
    - Molecular Targets

# Gap detection for drug discovery
gap_detection:
  enabled: true
  keywords:
    - untested compounds
    - unexplored targets
    - limited bioactivity data
    - novel mechanism
    - drug resistance
    - off-target effects
    - ADME optimization
    - clinical translation
    - combination therapy

# Biomedical entity extraction
entity_extraction:
  enabled: true
  entity_types:
    - disease
    - drug_name
    - protein_target
    - gene
    - organism
    - cell_type
    - assay_type
    - pathway
    - chemical_compound

# Output format
output:
  formats:
    - json
    - markdown
    - rdf

  biomedical_fields:
    - pmcid
    - pmid
    - doi
    - title
    - authors
    - publication_date
    - abstract
    - keywords
    - mesh_terms
    - disease_targets
    - compound_cids
    - molecular_targets
    - assay_types
    - organism_studied

# Validation rules
validation:
  require_abstract: true
  min_year: 2010
  max_papers_per_query: 500
  deduplication: by_doi_and_title

# Caching
cache:
  enabled: true
  ttl_hours: 24
  cache_dir: ./cache/literature_agent/

# Logging
logging:
  level: INFO
  log_file: ./logs/literature_agent.log
  log_api_calls: true
