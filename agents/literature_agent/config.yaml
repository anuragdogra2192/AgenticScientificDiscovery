name: Literature Agent
description: Search and analyze scientific literature to identify evidence and research gaps
version: "1.0.0"

# Core agent configuration
agent:
  type: specialist
  role: literature_researcher
  capabilities:
    - search_scientific_databases
    - extract_evidence
    - identify_gaps
    - synthesize_findings

# Database connectors
databases:
  openalex:
    name: OpenAlex
    description: Comprehensive academic library with millions of papers
    api_url: https://api.openalex.org
    endpoints:
      works: /works
      authors: /authors
      institutions: /institutions
      concepts: /concepts
    rate_limit: 10  # requests per second
    capabilities:
      - full_text_search
      - filtering_by_year
      - filtering_by_topic
      - citation_network

  arxiv:
    name: arXiv
    description: Preprint repository for physics, CS, math, and more
    api_url: https://arxiv.org/api
    endpoints:
      search: /arxiv/api/query
    rate_limit: 3  # requests per second
    capabilities:
      - full_text_search
      - filtering_by_category
      - filtering_by_date
      - metadata_extraction

  semantic_scholar:
    name: Semantic Scholar
    description: AI-powered research paper discovery
    api_url: https://api.semanticscholar.org/CorpusID
    rate_limit: 1  # requests per second (varies with key)
    capabilities:
      - semantic_search
      - citation_context
      - author_profiles

# Agent tools and capabilities
tools:
  search:
    - search_papers
    - search_by_author
    - search_by_keyword
    - advanced_filters

  extract:
    - parse_abstract
    - extract_methodology
    - extract_findings
    - extract_citations
    - extract_authors
    - extract_affiliations

  analyze:
    - identify_research_gaps
    - detect_trends
    - map_topic_space
    - analyze_citation_network
    - evaluate_paper_quality

  synthesize:
    - summarize_findings
    - generate_literature_review
    - identify_consensus
    - highlight_controversies

# Search configuration
search:
  default_limit: 50
  max_results: 1000
  default_sort: relevance
  filters:
    min_citations: 0
    publication_year_range: [1990, 2026]
    open_access_preference: true

# Output formats
output:
  formats:
    - json
    - markdown
    - bibtex
    - structured_summary

  fields:
    paper:
      - title
      - authors
      - publication_year
      - journal
      - doi
      - abstract
      - citations_count
      - openalex_id
      - arxiv_id
      - pdf_url

    findings:
      - key_evidence
      - methodologies
      - datasets_used
      - limitations
      - future_directions

    gap_analysis:
      - identified_gaps
      - unanswered_questions
      - potential_research_areas
      - underexplored_connections

# Agent behavior
behavior:
  timeout: 300  # seconds
  max_retries: 3
  batch_size: 25
  cache_results: true
  cache_ttl: 3600  # seconds

  search_strategy: |
    1. Start with semantic search to understand topic landscape
    2. Use citation network analysis to find seminal works
    3. Identify emerging research frontiers (recent papers)
    4. Look for contradictions and debates
    5. Map author and institution collaborations

# Monitoring and logging
monitoring:
  log_level: INFO
  track_api_calls: true
  track_performance: true
  error_handling: comprehensive
