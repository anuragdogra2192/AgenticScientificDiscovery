version: "2.0"
name: "literature-agent"
description: "Searches biomedical literature (Europe PMC, PubChem) for Mycobacterium tuberculosis drug discovery, extracts anti-tubercular evidence, and identifies research gaps."

# Define the underlying model or agent harness
executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.2
  max_tokens: 4096

# System prompt specialized for Mycobacterium tuberculosis drug discovery
prompt: |
  You are an expert Biomedical Research Agent specialized in anti-tubercular drug discovery and Mycobacterium tuberculosis (Mtb) biology.
  Your goals are:
  1. Search biomedical databases (Europe PMC and PubChem) for Mtb drug discovery questions, focusing on targets (e.g., DprE1, InhA, MmpL3, Pks13), drug-resistant strains (MDR/XDR-TB), and non-replicating persisters.
  2. Extract molecular targets, compound CIDs, minimum inhibitory concentrations (MIC), target inhibition data, and resistance mutation profiles.
  3. Identify structural evidence gaps, unstudied metabolic bottlenecks, or mechanisms overcoming phenotypic drug tolerance in Mtb.
  4. Output structured JSON findings consumable by the Hypothesis and Experiment agents.

  When responding, return ONLY valid JSON with this structure:
  {
    "papers": [
      {
        "title": "Paper title",
        "authors": ["Author 1", "Author 2"],
        "year": 2024,
        "pmcid": "PMC123456",
        "disease_targets": ["Mycobacterium tuberculosis"],
        "molecular_targets": ["DprE1", "InhA"],
        "key_findings": "Summary of anti-tubercular assay findings"
      }
    ],
    "research_gaps": [
      {
        "gap_description": "Description of Mtb resistance or target vulnerability gap",
        "priority": "high|medium|low",
        "related_papers": ["Paper title 1"]
      }
    ],
    "summary": "Overall summary of the Mycobacterium tuberculosis literature landscape"
  }

# Tool permissions and environment policies
tools:
  allow:
    - europe_pmc_search
    - pubchem_search
    - file_read
    - file_write
  network: true

# API Configuration
api:
  provider: anthropic
  timeout: 30
  retry_attempts: 3
  rate_limit: 10

# Database configuration
databases:
  europe_pmc:
    enabled: true
    api_url: "https://www.ebi.ac.uk/europepmc/webservices/rest"
    rate_limit: 10

  pubchem:
    enabled: true
    api_url: "https://pubchem.ncbi.nlm.nih.gov/rest/pug"
    rate_limit: 5

# Output configuration
output:
  format: json
  structured: true
  validation: strict

os_env:
  sandbox:
    write_paths: ["./results", "./cache"]
    allow_network: true

# Environment variables required
env_required:
  - ANTHROPIC_API_KEY

# Search parameters optimized for TB research
search_config:
  default_limit: 50
  max_limit: 500
  year_range: [2018, 2026]

  drug_discovery_keywords:
    - Mycobacterium tuberculosis drug discovery
    - anti-tubercular compound screening
    - MIC assay Mtb
    - drug-resistant tuberculosis mechanism
    - DprE1 InhA MmpL3 inhibitor