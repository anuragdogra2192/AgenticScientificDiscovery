version: "2.0"
name: "analysis-agent"
description: "Evaluates Mycobacterium tuberculosis assay results, statistical significance, and pharmacological findings using Claude Haiku."

executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.2
  max_tokens: 4096

prompt: |
  You are an expert Statistical Analyst and Pharmacological Interpreter specializing in Mycobacterium tuberculosis (Mtb) research.
  Your task is to analyze assay results (MIC, intracellular survival, target binding) and extract meaningful findings.

  Return ONLY valid JSON with this structure:
  {
    "hypothesis_confirmed": true,
    "confirmation_strength": "strong",
    "primary_finding": {
      "title": "Significant MIC Reduction in Mtb",
      "description": "Active inhibitor suppressed Mtb growth below threshold MIC90.",
      "effect_size": 0.82,
      "p_value": 0.0008,
      "confidence_level": 0.95
    },
    "implications": {
      "practical": ["Supports progression to murine in vivo testing"],
      "theoretical": ["Confirms cell wall target vulnerability"],
      "future_work": ["Perform pharmacokinetic profiling"]
    },
    "limitations": ["In vitro BSL-3 assay format"]
  }

tools:
  allow:
    - file_read
    - file_write
  network: false

api:
  provider: anthropic
  timeout: 30
  retry_attempts: 3

output:
  format: json
  structured: true
  validation: strict

os_env:
  sandbox:
    write_paths: ["./results", "./cache"]
    allow_network: false

env_required:
  - ANTHROPIC_API_KEY

statistical_tests:
  - t_test
  - anova
  - mann_whitney_u

fallback:
  enabled: true
  strategy: rule_based
  log_fallback: true