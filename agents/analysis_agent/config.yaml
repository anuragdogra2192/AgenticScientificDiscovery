name: Analysis Agent
description: Analyze experimental results and contextualize findings
version: "1.0.0"

# Core agent configuration
agent:
  type: specialist
  role: result_analyst
  capabilities:
    - result_validation
    - statistical_testing
    - effect_size_calculation
    - hypothesis_interpretation
    - finding_extraction
    - visualization_planning
    - knowledge_representation

# Result types and handling
result_types:

  experimental_data:
    name: Raw Experimental Data
    description: Actual data collected from experiments
    format: CSV, JSON, or database
    validation: Check completeness, outliers, missing values
    analysis: Full statistical pipeline

  simulation_results:
    name: Simulation Output
    description: Results from computational simulations
    format: Numerical matrices, time series
    validation: Check parameter validity, output ranges
    analysis: Trajectory analysis, sensitivity analysis

  literature_summary:
    name: Summarized Literature
    description: Aggregated results from meta-analysis
    format: Summary statistics, effect sizes
    validation: Check publication bias, quality scores
    analysis: Meta-regression, funnel plots

# Statistical tests configuration
statistical_tests:

  parametric_tests:

    t_test:
      name: Independent Samples t-test
      conditions:
        - independent_samples
        - continuous_outcomes
        - approximately_normal
        - similar_variance_preferred
      assumptions:
        - normality: Shapiro-Wilk test
        - homogeneity: Levene's test
        - independence: Study design
      output:
        - t_statistic
        - p_value
        - confidence_interval
        - effect_size_cohens_d

    paired_t_test:
      name: Paired Samples t-test
      conditions:
        - repeated_measures
        - continuous_outcomes
      assumptions:
        - normality_of_differences
        - independence_of_pairs
      output:
        - t_statistic
        - p_value
        - effect_size_cohens_d

    anova:
      name: Analysis of Variance
      conditions:
        - three_plus_groups
        - continuous_outcomes
        - between_subjects
      assumptions:
        - normality
        - homogeneity_of_variance
        - independence
      post_hoc:
        - tukey_hsd
        - bonferroni
        - scheffe
      output:
        - f_statistic
        - p_value
        - effect_size_eta_squared
        - post_hoc_comparisons

    linear_regression:
      name: Linear Regression
      conditions:
        - continuous_predictor
        - continuous_outcome
        - linear_relationship
      assumptions:
        - linearity
        - normality_of_residuals
        - homoscedasticity
        - independence
      diagnostics:
        - residual_plots
        - qq_plots
        - cook_distance
      output:
        - coefficients
        - r_squared
        - p_values
        - confidence_intervals

  non_parametric_tests:

    mann_whitney_u:
      name: Mann-Whitney U Test
      conditions:
        - independent_samples
        - ordinal_or_continuous
        - non_normal_data
      output:
        - u_statistic
        - p_value
        - effect_size_rank_biserial

    wilcoxon_signed_rank:
      name: Wilcoxon Signed-Rank Test
      conditions:
        - paired_samples
        - ordinal_or_continuous
        - non_normal_differences
      output:
        - z_statistic
        - p_value
        - effect_size

    kruskal_wallis:
      name: Kruskal-Wallis H Test
      conditions:
        - three_plus_groups
        - ordinal_or_continuous
        - non_normal_data
      output:
        - h_statistic
        - p_value
        - effect_size_epsilon_squared

    chi_square:
      name: Chi-Square Test
      conditions:
        - categorical_data
        - expected_frequencies_5_plus
      output:
        - chi_square_statistic
        - p_value
        - cramers_v
        - contingency_table

# Effect size measures
effect_sizes:

  continuous_outcomes:
    cohens_d:
      interpretation:
        small: 0.2
        medium: 0.5
        large: 0.8
      when_to_use: Comparing two means

    eta_squared:
      interpretation:
        small: 0.01
        medium: 0.06
        large: 0.14
      when_to_use: ANOVA effect size

    omega_squared:
      interpretation:
        small: 0.01
        medium: 0.06
        large: 0.14
      when_to_use: Population effect size estimate

    r_squared:
      interpretation:
        small: 0.02
        medium: 0.13
        large: 0.26
      when_to_use: Regression models

  categorical_outcomes:
    cramers_v:
      interpretation:
        small: 0.1
        medium: 0.3
        large: 0.5
      when_to_use: Chi-square test

    phi_coefficient:
      interpretation:
        small: 0.1
        medium: 0.3
        large: 0.5
      when_to_use: 2x2 contingency tables

    odds_ratio:
      interpretation:
        small: 1.5
        medium: 3.5
        large: 9.0
      when_to_use: Binary outcomes

# Confidence intervals
confidence_intervals:
  default_level: 0.95  # 95% CI
  levels: [0.90, 0.95, 0.99]
  methods:
    parametric: t-distribution
    bootstrap: resampling
    bayesian: credible intervals

# Hypothesis interpretation
hypothesis_interpretation:

  rules:
    - condition: p_value < alpha
      interpretation: Reject null hypothesis
      strength: Statistically significant
      alpha: 0.05

    - condition: effect_size >= medium
      interpretation: Practically meaningful
      strength: Substantial effect

    - condition: confidence_interval_excludes_zero
      interpretation: Result is robust
      strength: Supports hypothesis

    - condition: sample_size_adequate
      interpretation: Study was well-powered
      strength: Finding is reliable

  consistency_check:
    - prediction_matches_direction: Direction of effect as predicted
    - magnitude_reasonable: Effect size consistent with theory
    - robustness_across_analyses: Consistent in sensitivity tests
    - no_unusual_patterns: No anomalous data patterns

# Findings and insights
finding_extraction:

  primary_findings:
    - hypothesis_confirmation_status
    - effect_size_and_direction
    - statistical_significance
    - confidence_intervals
    - practical_significance

  secondary_findings:
    - moderating_variables
    - mediating_mechanisms
    - subgroup_differences
    - boundary_conditions
    - unexpected_patterns

  anomalies:
    - outliers_and_influencers
    - assumption_violations
    - ceiling_floor_effects
    - missing_patterns

# Visualization planning
visualizations:

  descriptive:
    - means_and_error_bars
    - box_plots
    - violin_plots
    - scatter_plots
    - histograms
    - density_plots

  inferential:
    - confidence_interval_plots
    - effect_size_forest_plots
    - interaction_plots
    - residual_diagnostic_plots
    - qq_plots

  comparative:
    - group_comparison_plots
    - effect_size_comparisons
    - forest_plots_meta_analysis
    - bubble_plots_three_variables

  temporal:
    - time_series_plots
    - trajectory_plots
    - learning_curves
    - convergence_diagnostics

# Literature contextualization
contextualization:

  compare_with_literature:
    - effect_size_similar_studies
    - direction_matches_theory
    - magnitude_expected
    - boundary_conditions_align

  identify_novel_findings:
    - contradicts_prior_work
    - extends_theory
    - unexpected_mechanism
    - applies_to_new_domain

  assess_generalizability:
    - sample_characteristics
    - ecological_validity
    - boundary_conditions
    - replication_likelihood

# Knowledge representation
knowledge_graph:

  entities:
    - hypothesis
    - prediction
    - finding
    - mechanism
    - boundary_condition
    - future_question

  relationships:
    - confirms
    - contradicts
    - qualifies
    - explains
    - predicts
    - extends

  properties:
    - confidence_level
    - evidence_strength
    - applicability_scope

# Quality and rigor standards
quality_assurance:

  data_quality:
    - check_missing_values
    - check_outliers
    - check_data_types
    - check_ranges
    - check_completeness

  statistical_rigor:
    - check_assumptions
    - check_power
    - check_multiple_comparisons
    - check_effect_sizes
    - check_sensitivity_analyses

  interpretation_standards:
    - avoid_dichotomous_thinking
    - report_all_outcomes
    - acknowledge_limitations
    - discuss_alternative_explanations
    - note_generalizability_limits

# Output specification
output:
  formats:
    - json
    - markdown
    - html_report
    - visualization_specs

  sections:
    - data_summary
    - descriptive_statistics
    - assumption_testing
    - primary_statistical_tests
    - effect_sizes_and_ci
    - hypothesis_interpretation
    - findings_summary
    - literature_comparison
    - limitations
    - implications
    - future_directions
    - visualizations_needed

# Monitoring and logging
monitoring:
  log_level: INFO
  track_assumptions: true
  track_statistics: true
  track_findings: true
  save_analysis_log: true
