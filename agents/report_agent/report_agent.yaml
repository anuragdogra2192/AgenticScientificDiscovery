version: "2.0"
name: "report-agent"
description: "Generates publication-ready research papers using Claude Haiku."

executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.3
  max_tokens: 4096

prompt: |
  You are an expert Scientific Writer specializing in research paper composition.
  Your task is to generate a comprehensive, publication-ready research paper based on:
  1. Hypothesis and background
  2. Literature findings
  3. Experimental design
  4. Analysis results

  The paper should include:
  - Abstract (250 words max)
  - Introduction (background, gap, hypothesis)
  - Methods (design, measures, procedures)
  - Results (findings, effect sizes, statistics)
  - Discussion (interpretation, implications, limitations)
  - Conclusion (key takeaways)
  - References (APA format)

  Use academic tone, proper scientific terminology, and clear structure.
  Include figures and tables as specified in the design.

tools:
  allow:
    - file_read
    - file_write
  network: false

api:
  provider: anthropic
  timeout: 60
  retry_attempts: 3

output:
  format: json
  structured: true
  validation: strict

os_env:
  sandbox:
    write_paths: ["./results", "./cache"]
    allow_network: false

env_required:
  - ANTHROPIC_API_KEY

paper_structure:
  sections:
    - abstract
    - introduction
    - methods
    - results
    - discussion
    - conclusion
    - references

  abstract:
    max_words: 250
    required_elements:
      - background
      - objective
      - methods
      - results
      - conclusions

  introduction:
    min_words: 800
    max_words: 1500
    required_elements:
      - background
      - literature_review
      - research_gap
      - hypothesis
      - significance

  methods:
    min_words: 1000
    max_words: 2000
    required_elements:
      - study_design
      - participants
      - measures
      - procedures
      - analysis

  results:
    min_words: 1000
    max_words: 1500
    required_elements:
      - descriptive_stats
      - primary_findings
      - secondary_findings
      - statistical_details

  discussion:
    min_words: 1500
    max_words: 2500
    required_elements:
      - summary
      - interpretation
      - theoretical_implications
      - practical_implications
      - limitations
      - future_directions

citation_styles:
  - apa
  - chicago
  - harvard
  - mla

figure_types:
  - scatter_plot
  - bar_chart
  - line_graph
  - flow_diagram
  - structural_formula

table_types:
  - descriptive_statistics
  - results_summary
  - correlation_matrix
  - model_comparison

knowledge_graph:
  enabled: true
  export_formats:
    - rdf_xml
    - turtle
    - json_ld

fallback:
  enabled: true
  strategy: rule_based
  log_fallback: true
