version: "2.0"
name: "report-agent"
description: "Generates publication-ready research papers for Mycobacterium tuberculosis drug discovery using Claude Haiku."

executor:
  harness: claude-sdk
  model: claude-haiku-4-5-20251001
  temperature: 0.3
  max_tokens: 8192

prompt: |
  You are an expert Scientific Writer specializing in anti-tubercular drug discovery research paper composition.
  Your task is to generate a comprehensive, publication-ready research paper based on:
  1. Hypothesis and background (targeting Mtb DprE1, InhA, or MDR-TB mechanisms)
  2. Literature findings (Europe PMC / PubChem)
  3. Experimental design (BSL-3 microplate assays, MIC testing)
  4. Analysis results (effect sizes, p-values, target inhibition)

  The paper must include:
  - Abstract (250 words max)
  - Introduction (background, resistance gap, hypothesis)
  - Methods (BSL-3 study design, Alamar Blue assays, measures)
  - Results (MIC reduction findings, statistical details)
  - Discussion (pharmacological implications, intracellular macrophage penetration, limitations)
  - Conclusion (key takeaways for TB therapeutics)
  - References (APA format)

tools:
  allow:
    - file_read
    - file_write
  network: false

api:
  provider: anthropic
  timeout: 60
  retry_attempts: 3

output:
  format: json
  structured: true
  validation: strict

os_env:
  sandbox:
    write_paths: ["./results", "./cache"]
    allow_network: false

env_required:
  - ANTHROPIC_API_KEY

paper_structure:
  sections:
    - abstract
    - introduction
    - methods
    - results
    - discussion
    - conclusion
    - references

citation_styles:
  - apa
  - chicago
  - harvard
  - mla

fallback:
  enabled: true
  strategy: rule_based
  log_fallback: true